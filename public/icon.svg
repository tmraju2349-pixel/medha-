<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Left Tech Brain Gradients -->
    <linearGradient id="techBlueGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="techBlueGradMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2FF" />
      <stop offset="45%" stop-color="#0077E6" />
      <stop offset="100%" stop-color="#003E9E" />
    </linearGradient>
    <linearGradient id="techBlueDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#034694" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>
    <linearGradient id="techBlueDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#05192D" />
    </linearGradient>

    <!-- Right Organic Brain Warm Gradients -->
    <linearGradient id="warmRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="45%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF3366" />
    </linearGradient>
    <linearGradient id="warmRibbon2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="55%" stop-color="#E52E71" />
      <stop offset="100%" stop-color="#9C27B0" />
    </linearGradient>
    <linearGradient id="warmRibbon3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="55%" stop-color="#C2185B" />
      <stop offset="100%" stop-color="#7B1FA2" />
    </linearGradient>
    <linearGradient id="warmRibbon4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA68C8" />
      <stop offset="65%" stop-color="#6A1B9A" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>

    <!-- Medha Wordmark Gradient -->
    <linearGradient id="medhaWordmarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0072CE" />
      <stop offset="50%" stop-color="#0052B4" />
      <stop offset="100%" stop-color="#002D72" />
    </linearGradient>

    <!-- Shadow filter for 3D depth -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="10" flood-color="#001845" flood-opacity="0.16" />
    </filter>
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="medha-full-logo" transform="translate(30, 45)">
    <!-- BRAIN ICON GROUP -->
    <g id="brain-icon" filter="url(#softShadow)" transform="translate(30, 10)">
      <!-- Ground shadow under brain -->
      <ellipse cx="160" cy="420" rx="100" ry="12" fill="#001845" opacity="0.14" />

      <!-- LEFT HEMISPHERE: TECH / CIRCUITS -->
      <g id="left-hemisphere">
        <!-- Fold 1 (Top) -->
        <path d="M 152 42 C 118 42 96 58 84 84 C 76 100 86 120 106 120 C 130 120 144 120 152 120 Z"
              fill="url(#techBlueGradTop)" />
        <path d="M 152 42 C 124 42 100 56 90 78 C 106 72 128 70 152 72 Z"
              fill="#7DD3FC" opacity="0.45" />

        <!-- Fold 2 (Upper-Mid) -->
        <path d="M 152 120 C 90 120 62 136 54 162 C 46 188 62 208 88 208 C 118 208 140 208 152 208 Z"
              fill="url(#techBlueGradMid)" />

        <!-- Fold 3 (Mid lobe) -->
        <path d="M 152 208 C 76 208 46 224 42 250 C 38 276 56 294 92 294 C 122 294 142 294 152 294 Z"
              fill="url(#techBlueDark)" />

        <!-- Fold 4 (Lower lobe) -->
        <path d="M 152 294 C 86 294 62 308 62 328 C 62 348 82 360 110 360 C 134 360 146 358 152 356 Z"
              fill="url(#techBlueDeep)" />

        <!-- Circuit Traces & Glowing Nodes -->
        <g id="circuits" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glowLight)">
          <!-- Trace 1 -->
          <path d="M 148 82 L 116 82" />
          <circle cx="112" cy="82" r="4.5" fill="#FFFFFF" />

          <!-- Trace 2 -->
          <path d="M 148 130 L 102 130 L 86 146 L 72 146" />
          <circle cx="68" cy="146" r="4.5" fill="#FFFFFF" />

          <!-- Trace 3 -->
          <path d="M 148 178 L 90 178" />
          <circle cx="86" cy="178" r="5.2" fill="#FFFFFF" />

          <!-- Trace 4 -->
          <path d="M 148 226 L 110 226 L 96 242 L 68 242" />
          <circle cx="64" cy="242" r="4.5" fill="#FFFFFF" />

          <!-- Trace 5 -->
          <path d="M 148 272 L 104 272" />
          <circle cx="100" cy="272" r="4.5" fill="#FFFFFF" />

          <!-- Vertical interconnection bus -->
          <path d="M 136 82 L 136 272" stroke-width="2.8" stroke-dasharray="8 6" opacity="0.8" />
          <circle cx="136" cy="130" r="3.2" fill="#FFFFFF" />
          <circle cx="136" cy="178" r="3.2" fill="#FFFFFF" />
          <circle cx="136" cy="226" r="3.2" fill="#FFFFFF" />
        </g>
      </g>

      <!-- RIGHT HEMISPHERE: WARM ORGANIC FLOWING RIBBONS -->
      <g id="right-hemisphere">
        <!-- Ribbon 1 (Top swirl - Golden Yellow to Orange to Coral) -->
        <path d="M 162 44 C 174 42 202 46 230 66 C 262 88 272 118 260 144 C 250 162 226 176 200 176 C 176 176 164 168 162 166 C 174 140 200 122 220 108 C 206 86 182 66 162 44 Z"
              fill="url(#warmRibbon1)" />

        <!-- Ribbon 2 (Upper-Mid swirl - Orange to Crimson to Purple) -->
        <path d="M 162 152 C 180 156 216 162 246 184 C 276 206 280 236 266 262 C 252 284 224 294 198 294 C 174 294 164 284 162 280 C 176 254 206 240 228 224 C 214 198 186 176 162 152 Z"
              fill="url(#warmRibbon2)" />

        <!-- Ribbon 3 (Lower-Mid swirl - Coral to Ruby to Violet) -->
        <path d="M 162 254 C 178 258 208 266 234 288 C 260 310 258 338 238 360 C 222 376 198 380 178 380 C 166 380 162 374 162 370 C 172 348 198 334 214 318 C 200 296 176 278 162 254 Z"
              fill="url(#warmRibbon3)" />

        <!-- Ribbon 4 (Bottom tail - Lavender to Deep Plum) -->
        <path d="M 162 352 C 170 354 184 362 192 376 C 200 394 190 410 178 422 C 170 430 164 432 162 432 C 160 420 162 386 162 352 Z"
              fill="url(#warmRibbon4)" />
      </g>
    </g>

    <!-- MEDHA TYPOGRAPHY & WORDMARK -->
    <g id="medha-wordmark" transform="translate(365, 145)">
      <!-- Main Text: medha -->
      <text x="0" y="70"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="100"
            font-weight="900"
            letter-spacing="-3"
            fill="url(#medhaWordmarkGrad)">
        medha
      </text>

      <!-- Subtitle -->
      <text x="2" y="112"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="20"
            font-weight="600"
            letter-spacing="0.2"
            fill="#1E293B">
        Memory Enhancement and
      </text>
      <text x="2" y="140"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            font-size="20"
            font-weight="600"
            letter-spacing="0.2"
            fill="#1E293B">
        Dementia Health Assistant
      </text>
    </g>
  </g>
</svg>
