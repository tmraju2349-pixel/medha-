    <script>
      // Suppress benign [vite] websocket connection logs in Cloud Run / containerized preview
      (function() {
        function shouldFilter(args) {
          try {
            for (var i = 0; i < args.length; i++) {
              var a = args[i];
              var str = String((a && a.message) ? a.message : (a || ''));
              if (
                str.indexOf('[vite]') !== -1 ||
                str.indexOf('failed to connect to websocket') !== -1 ||
                str.indexOf('WebSocket connection to') !== -1 ||
                str.indexOf('server connection lost. Polling for restart') !== -1
              ) {
                return true;
              }
            }
          } catch(e) {}
          return false;
        }
        var _origErr = console.error;
        console.error = function() {
          if (shouldFilter(arguments)) return;
          _origErr.apply(console, arguments);
        };
        var _origWarn = console.warn;
        console.warn = function() {
          if (shouldFilter(arguments)) return;
          _origWarn.apply(console, arguments);
        };
        var _origInfo = console.info;
        console.info = function() {
          if (shouldFilter(arguments)) return;
          _origInfo.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (e && e.message && shouldFilter([e.message])) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
