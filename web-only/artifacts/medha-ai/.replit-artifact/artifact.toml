kind = "mobile"
previewPath = "/"
title = "Medha AI Cognitive Care"
description = "A calm, voice-assisted cognitive care companion for elderly dementia patients and their caregivers in the North Eastern Region, supporting daily routines, safety, memory assistance, and future adaptive games."
version = "1.0.0"
id = "artifacts/medha-ai"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24216

[services.development]
run = "pnpm --filter @workspace/medha-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medha-ai", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/medha-ai", "run", "serve" ]

[services.env]
PORT = "24216"
BASE_PATH = "/"
