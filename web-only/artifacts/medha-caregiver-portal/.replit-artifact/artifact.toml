kind = "web"
previewPath = "/medha-caregiver-portal/"
title = "Medha Caregiver Portal"
description = "A secure, responsive caregiver workspace for reviewing linked patients’ care plans, safety, voice diary, memory cues, and cognitive activity through the Medha AI API."
version = "1.0.0"
id = "artifacts/medha-caregiver-portal"
router = "path"

[[services]]
name = "web"
paths = [ "/medha-caregiver-portal/" ]
localPort = 18696

[services.development]
run = "pnpm --filter @workspace/medha-caregiver-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medha-caregiver-portal", "run", "build" ]
serve = "static"
publicDir = "artifacts/medha-caregiver-portal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18696"
BASE_PATH = "/medha-caregiver-portal/"
